<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Build and Repair images</title>
<style>
@font-face { font-family: Rajdhani; font-weight: 600; src: url(fonts/rajdhani-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Rajdhani; font-weight: 700; src: url(fonts/rajdhani-latin-700-normal.woff2) format('woff2'); }
:root {
  --bg0: #040912;
  --bg1: #0a1b35;
  --cyan: #5fd7ff;
  --ink: #eef4fc;
  --muted: #a9bdd6;
  --yellow: #f5c400;
  --red: #ff6464;
  --green: #4fdc8f;
  --panel: rgba(9, 24, 48, 0.78);
  --line: rgba(95, 215, 255, 0.30);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg0); }
body { font-family: Inter, sans-serif; color: var(--ink); }

.canvas {
  position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 50% at 30% 35%, rgba(40, 110, 220, 0.22), transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 20%, rgba(120, 70, 200, 0.14), transparent 70%),
    linear-gradient(180deg, var(--bg1), var(--bg0) 85%);
}
.canvas > svg.layer { position: absolute; inset: 0; }

.hazard {
  position: absolute; left: 0; right: 0; height: 14px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 22px, #111 22px 44px);
}
.hazard.top { top: 0; }
.hazard.bottom { bottom: 0; }

.kicker {
  font-family: Rajdhani; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.28em; color: var(--cyan);
}
.title {
  font-family: Rajdhani; font-weight: 700; text-transform: uppercase;
  line-height: 0.9; letter-spacing: 0.01em; color: #fff;
  text-shadow: 0 0 28px rgba(95, 215, 255, 0.35), 0 4px 0 rgba(0, 0, 0, 0.45);
}
.badge {
  display: inline-flex; align-items: center; gap: 18px;
  font-family: Rajdhani; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: #111; background: var(--yellow);
  box-shadow: 0 6px 24px rgba(245, 196, 0, 0.25);
}
.badge::before, .badge::after {
  content: ""; align-self: stretch; width: 34px;
  background: repeating-linear-gradient(-45deg, #111 0 7px, transparent 7px 14px);
}

/* ---------- thumbnail ---------- */
.thumb { width: 1024px; height: 1024px; }
.thumb .fade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 430px;
  background: linear-gradient(180deg, transparent, rgba(4, 9, 18, 0.88) 45%, var(--bg0));
}
.thumb .text { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; }
.thumb .kicker { font-size: 40px; margin-bottom: 6px; }
.thumb .title { font-size: 150px; }
.thumb .badge { font-size: 46px; padding: 0 0; margin-top: 34px; height: 70px; }

/* ---------- gallery ---------- */
.wide { width: 1920px; height: 1080px; }
.wide .content { position: absolute; left: 110px; top: 100px; width: 1000px; }
.wide .kicker { font-size: 32px; margin-bottom: 14px; }
.wide .title { font-size: 104px; margin-bottom: 52px; }
.wide .art { position: absolute; right: 0; bottom: 70px; width: 760px; height: 760px; overflow: visible; }

.compare { display: flex; align-items: stretch; gap: 26px; margin-bottom: 52px; }
.card {
  flex: 1; background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
  padding: 30px 34px 34px; backdrop-filter: blur(2px);
}
.card .head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.card .tag { font-family: Rajdhani; font-weight: 700; font-size: 40px; letter-spacing: 0.12em; text-transform: uppercase; }
.card p { font-size: 30px; line-height: 1.38; color: var(--ink); }
.card.bad { border-color: rgba(255, 100, 100, 0.55); }
.card.bad .tag { color: var(--red); }
.card.good { border-color: rgba(79, 220, 143, 0.6); box-shadow: 0 0 40px rgba(79, 220, 143, 0.12); }
.card.good .tag { color: var(--green); }
.card.info { border-color: rgba(95, 215, 255, 0.6); box-shadow: 0 0 40px rgba(95, 215, 255, 0.10); }
.card.info .tag { color: var(--cyan); }
.card.cost { border-color: rgba(245, 196, 0, 0.6); box-shadow: 0 0 40px rgba(245, 196, 0, 0.10); }
.card.cost .tag { color: var(--yellow); }
.arrow { align-self: center; color: var(--cyan); }

.points { list-style: none; display: grid; gap: 24px; }
.points li { display: flex; gap: 22px; align-items: flex-start; font-size: 31px; line-height: 1.35; color: var(--ink); }
.points li svg { flex: none; margin-top: 4px; }
.points li b { color: #fff; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
.tile {
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
  padding: 24px 26px; display: flex; gap: 20px; align-items: flex-start;
}
.tile svg { flex: none; width: 64px; height: 64px; }
.tile h3 { font-family: Rajdhani; font-weight: 700; font-size: 44px; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; line-height: 1; margin: 4px 0 10px; }
.tile p { font-size: 24px; line-height: 1.38; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chip {
  font-size: 22px; color: var(--ink); padding: 9px 18px; border-radius: 999px;
  border: 2px solid var(--line); background: rgba(95, 215, 255, 0.07);
}

.warn {
  margin-top: 46px; display: flex; align-items: center; gap: 26px;
  background: rgba(245, 196, 0, 0.1); border: 3px solid var(--yellow); border-radius: 18px;
  padding: 26px 32px; position: relative; overflow: hidden;
}
.warn::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 22px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #111 10px 20px);
}
.warn .txt { margin-left: 18px; }
.warn .txt b { display: block; font-family: Rajdhani; font-weight: 700; font-size: 40px; letter-spacing: 0.06em; color: var(--yellow); text-transform: uppercase; }
.warn .txt span { font-size: 28px; color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
const f = n => +n.toFixed(2);

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function stars(w, h, n, seed) {
  const r = rng(seed);
  let out = '';
  for (let i = 0; i < n; i++) {
    const x = f(r() * w), y = f(r() * h), s = r();
    const rad = s > 0.97 ? 2.2 : s > 0.85 ? 1.5 : 0.9;
    out += `<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${f(0.25 + r() * 0.6)}"/>`;
  }
  return out;
}

// Isometric projection: +x goes down-right, +y goes down-left, +z goes up.
function iso(s, ox, oy) {
  const L = (x, y, z) => [(x - y) * C30 * s, (x + y) * S30 * s - z * s];
  const P = (x, y, z) => { const l = L(x, y, z); return [ox + l[0], oy + l[1]]; };
  const M = (o, u, v) => {
    const p = P(...o), a = L(...u), b = L(...v);
    return `matrix(${f(a[0])},${f(a[1])},${f(b[0])},${f(b[1])},${f(p[0])},${f(p[1])})`;
  };
  const pts = a => a.map(p => P(...p).map(f).join(',')).join(' ');
  return { L, P, M, pts, s };
}

// Faces visible from the viewer: top (z = z1), "left" (y = y1) and "right" (x = x1).
function box(I, x0, y0, z0, x1, y1, z1, col, sw = 2) {
  const top = [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
  const left = [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]];
  const right = [[x1, y1, z1], [x1, y0, z1], [x1, y0, z0], [x1, y1, z0]];
  return `<g stroke="${col.edge}" stroke-width="${sw}" stroke-linejoin="round" ${col.op ? `fill-opacity="${col.op}"` : ''}>
    <polygon points="${I.pts(left)}" fill="${col.left}"/>
    <polygon points="${I.pts(right)}" fill="${col.right}"/>
    <polygon points="${I.pts(top)}" fill="${col.top}"/></g>`;
}
const leftFace = (I, x0, y1, z1) => I.M([x0, y1, z1], [1, 0, 0], [0, 0, -1]);
const rightFace = (I, x1, y1, z1) => I.M([x1, y1, z1], [0, -1, 0], [0, 0, -1]);
const topFace = (I, x0, y0, z) => I.M([x0, y0, z], [1, 0, 0], [0, 1, 0]);

function defs(id) {
  return `<defs>
    <filter id="${id}glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="${id}soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="${id}cylBlue" x1="0" x2="1"><stop offset="0" stop-color="#1b4c96"/><stop offset=".35" stop-color="#4a92f0"/><stop offset=".7" stop-color="#2a66c4"/><stop offset="1" stop-color="#143a75"/></linearGradient>
    <linearGradient id="${id}cylDark" x1="0" x2="1"><stop offset="0" stop-color="#1a2029"/><stop offset=".35" stop-color="#4a5566"/><stop offset=".7" stop-color="#2f3744"/><stop offset="1" stop-color="#151a21"/></linearGradient>
    <radialGradient id="${id}emit"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#9eeaff"/><stop offset="1" stop-color="#5fd7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id}spark"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/></radialGradient>
  </defs>`;
}

function uprightCyl(I, id, x, y, z0, h, r, fill, capFill, edge) {
  const [cx, cyb] = I.P(x, y, z0);
  const cyt = cyb - h * I.s;
  const rx = Math.SQRT2 * C30 * r * I.s, ry = Math.SQRT2 * S30 * r * I.s;
  return `<g stroke="${edge}" stroke-width="1.6">
    <path d="M${f(cx - rx)},${f(cyb)} A${f(rx)},${f(ry)} 0 0 0 ${f(cx + rx)},${f(cyb)} L${f(cx + rx)},${f(cyt)} L${f(cx - rx)},${f(cyt)} Z" fill="url(#${id}${fill})"/>
    <ellipse cx="${f(cx)}" cy="${f(cyt)}" rx="${f(rx)}" ry="${f(ry)}" fill="${capFill}"/></g>`;
}

// A canister lying in a face, pointing out of it along the face normal.
function canister(I, faceM, normal, u, v, r, depth) {
  const n = I.L(...normal);
  const steps = 7;
  let out = '';
  for (let k = 0; k <= steps; k++) {
    const d = depth * k / steps;
    const t = k / steps;
    const c = k === steps ? '#3f8cf2' : `rgb(${Math.round(18 + 22 * t)},${Math.round(52 + 50 * t)},${Math.round(104 + 90 * t)})`;
    out += `<g transform="translate(${f(n[0] * d)},${f(n[1] * d)})"><g transform="${faceM}"><circle cx="${u}" cy="${v}" r="${r}" fill="${c}"/></g></g>`;
  }
  const cap = `translate(${f(n[0] * depth)},${f(n[1] * depth)})`;
  out += `<g transform="${cap}"><g transform="${faceM}">
      <circle cx="${u}" cy="${v}" r="${f(r * 0.62)}" fill="none" stroke="#9cc9ff" stroke-width="2" vector-effect="non-scaling-stroke" opacity=".7"/>
      <circle cx="${f(u - r * 0.3)}" cy="${f(v - r * 0.32)}" r="${f(r * 0.22)}" fill="#cfe4ff" opacity=".75"/>
      <circle cx="${u}" cy="${v}" r="${r}" fill="none" stroke="#0b1d3a" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g></g>`;
  return out;
}

function basePanel(w, h, dark) {
  let slats = '';
  for (let i = 0; i < 3; i++) slats += `<rect x="${f(0.355 + i * 0.105)}" y="0.21" width="0.06" height="0.22" rx="0.02" fill="#1e4683"/>`;
  return `
    <rect x="0" y="0" width="${w}" height="0.075" fill="${dark}" opacity=".55"/>
    <rect x="0" y="${f(h - 0.065)}" width="${w}" height="0.065" fill="${dark}" opacity=".7"/>
    <rect x="0" y="0" width="0.055" height="${h}" fill="${dark}" opacity=".45"/>
    <rect x="${f(w - 0.055)}" y="0" width="0.055" height="${h}" fill="${dark}" opacity=".45"/>
    <rect x="0.25" y="0.14" width="0.54" height="0.37" rx="0.075" fill="#f2c200"/>
    <rect x="0.295" y="0.18" width="0.45" height="0.29" rx="0.05" fill="#0f264b"/>
    ${slats}
    <rect x="0.12" y="0.19" width="0.055" height="0.2" rx="0.018" fill="#5fd7ff"/>
    <rect x="0.12" y="0.43" width="0.055" height="0.04" rx="0.01" fill="#4fdc8f"/>`;
}

// The Build and Repair block (large grid), base corner at world origin.
function barBlock(I, id) {
  const blue = { top: '#5c9bf0', left: '#3473d4', right: '#22529f', edge: '#081730' };
  const graphite = { top: '#4b5666', left: '#363f4c', right: '#262d37', edge: '#0b0f15' };
  const plate = { top: '#9aa6b8', left: '#717d8f', right: '#566170', edge: '#151b24' };
  let g = '';
  // base
  g += box(I, 0, 0, 0, 1, 1, 0.62, blue);
  g += `<g transform="${leftFace(I, 0, 1, 0.62)}">${basePanel(1, 0.62, '#14396f')}</g>`;
  g += `<g transform="${rightFace(I, 1, 1, 0.62)}">${basePanel(1, 0.62, '#0d2a55')}</g>`;
  g += `<g transform="${topFace(I, 0, 0, 0.62)}"><rect x="0.06" y="0.06" width="0.88" height="0.88" fill="none" stroke="#2c62b8" stroke-width="2" vector-effect="non-scaling-stroke"/></g>`;
  // tower core
  g += box(I, 0.2, 0.2, 0.62, 0.8, 0.8, 1.25, graphite);
  g += `<g transform="${leftFace(I, 0.2, 0.8, 1.25)}"><rect x="0.27" y="0" width="0.06" height="0.63" fill="#1a2028"/></g>`;
  g += `<g transform="${rightFace(I, 0.8, 0.8, 1.25)}"><rect x="0.27" y="0" width="0.06" height="0.63" fill="#12161c"/></g>`;
  // canisters on the tower faces (right face first: it sits further back on screen)
  const lm = leftFace(I, 0.2, 0.8, 1.25), rm = rightFace(I, 0.8, 0.8, 1.25);
  for (const v of [0.12, 0.315, 0.51]) {
    for (const u of [0.135, 0.465]) g += canister(I, rm, [1, 0, 0], u, v, 0.088, 0.075);
  }
  for (const v of [0.12, 0.315, 0.51]) {
    for (const u of [0.135, 0.465]) g += canister(I, lm, [0, 1, 0], u, v, 0.088, 0.075);
  }
  // top plate
  g += box(I, 0.1, 0.1, 1.25, 0.9, 0.9, 1.32, plate);
  // upright canisters and the emitter, back to front
  const items = [
    [0.27, 0.27], [0.5, 0.22], [0.73, 0.27], [0.22, 0.5], [0.78, 0.5], [0.27, 0.73], [0.5, 0.78], [0.73, 0.73], ['emitter', 0.5, 0.5]
  ].map(a => a[0] === 'emitter' ? { e: true, x: a[1], y: a[2] } : { x: a[0], y: a[1] })
    .sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const it of items) {
    if (it.e) {
      g += uprightCyl(I, id, it.x, it.y, 1.32, 0.2, 0.11, 'cylDark', '#2b333f', '#07090d');
    } else {
      g += uprightCyl(I, id, it.x, it.y, 1.32, 0.09, 0.07, 'cylBlue', '#6aa5f5', '#081730');
    }
  }
  return g;
}

function steelCube(I, x, y, z) {
  const col = { top: '#c9d1dc', left: '#9fa9b8', right: '#7d8797', edge: '#27303c' };
  let g = box(I, x, y, z, x + 1, y + 1, z + 1, col);
  const line = `fill="none" stroke="#5d6878" stroke-width="1.4" vector-effect="non-scaling-stroke" opacity=".7"`;
  g += `<g transform="${leftFace(I, x, y + 1, z + 1)}"><rect x=".08" y=".08" width=".84" height=".84" ${line}/></g>`;
  g += `<g transform="${rightFace(I, x + 1, y + 1, z + 1)}"><rect x=".08" y=".08" width=".84" height=".84" ${line}/></g>`;
  g += `<g transform="${topFace(I, x, y, z + 1)}"><rect x=".08" y=".08" width=".84" height=".84" ${line}/></g>`;
  return g;
}

function holoCube(I, x, y, z, color = '#5fd7ff') {
  let g = box(I, x, y, z, x + 1, y + 1, z + 1, { top: color, left: color, right: color, edge: color, op: 0.1 }, 2.2);
  const grid = `stroke="${color}" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".35"`;
  const lines = `<line x1=".5" y1="0" x2=".5" y2="1" ${grid}/><line x1="0" y1=".5" x2="1" y2=".5" ${grid}/>`;
  g += `<g transform="${leftFace(I, x, y + 1, z + 1)}">${lines}</g>`;
  g += `<g transform="${rightFace(I, x + 1, y + 1, z + 1)}">${lines}</g>`;
  g += `<g transform="${topFace(I, x, y, z + 1)}">${lines}</g>`;
  return g;
}

function weldCube(I, x, y, z) {
  // Half welded: steel up to 55%, hologram above, glowing seam at the weld line.
  const h = 0.55;
  let g = box(I, x, y, z, x + 1, y + 1, z + h, { top: '#c9d1dc', left: '#9fa9b8', right: '#7d8797', edge: '#27303c' });
  g += box(I, x, y, z + h, x + 1, y + 1, z + 1, { top: '#5fd7ff', left: '#5fd7ff', right: '#5fd7ff', edge: '#5fd7ff', op: 0.1 }, 2.2);
  const seam = [[x, y + 1, z + h], [x + 1, y + 1, z + h], [x + 1, y, z + h]];
  g += `<polyline points="${I.pts(seam)}" fill="none" stroke="#ffb347" stroke-width="5" stroke-linecap="round" opacity=".95"/>`;
  return g;
}

function deck(I, x0, y0, x1, y1) {
  let g = box(I, x0, y0, -0.14, x1, y1, 0, { top: '#1f2a3a', left: '#161e2a', right: '#10161f', edge: '#060a10' });
  const m = topFace(I, x0, y0, 0);
  let lines = '';
  for (let i = 1; i < x1 - x0; i++) lines += `<line x1="${i}" y1="0" x2="${i}" y2="${y1 - y0}"/>`;
  for (let j = 1; j < y1 - y0; j++) lines += `<line x1="0" y1="${j}" x2="${x1 - x0}" y2="${j}"/>`;
  g += `<g transform="${m}" stroke="#34465f" stroke-width="1.2" vector-effect="non-scaling-stroke" opacity=".8">${lines}</g>`;
  return g;
}

// Full scene: deck, a structure being built from a projection, the block, and the nanobot stream.
function scene(I, id) {
  let g = defs(id);
  const mid = I.P(2, 0, 0);
  g += `<radialGradient id="${id}deckG" gradientUnits="userSpaceOnUse" cx="${f(mid[0])}" cy="${f(mid[1])}" r="${f(I.s * 2.7)}"><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="${id}deckM" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect x="-2000" y="-2000" width="5000" height="5000" fill="url(#${id}deckG)"/></mask>`;
  g += `<g mask="url(#${id}deckM)">${deck(I, -2, -4, 6, 3)}</g>`;
  const cubes = [
    { x: 2, y: -2, z: 0, t: 's' }, { x: 3, y: -2, z: 0, t: 's' }, { x: 2, y: -1, z: 0, t: 's' }, { x: 3, y: -1, z: 0, t: 'h' },
    { x: 2, y: -2, z: 1, t: 's' }, { x: 3, y: -2, z: 1, t: 'h' }, { x: 2, y: -1, z: 1, t: 'w' }, { x: 3, y: -1, z: 1, t: 'h' },
  ].sort((a, b) => (a.x + a.y + a.z) - (b.x + b.y + b.z));
  for (const c of cubes) g += c.t === 's' ? steelCube(I, c.x, c.y, c.z) : c.t === 'w' ? weldCube(I, c.x, c.y, c.z) : holoCube(I, c.x, c.y, c.z);

  // soft light pooling under the block and the weld point
  const under = I.P(0.5, 0.5, 0);
  g += `<ellipse cx="${f(under[0])}" cy="${f(under[1])}" rx="${f(I.s * 1.3)}" ry="${f(I.s * 0.7)}" fill="#3a8cff" opacity=".18" filter="url(#${id}soft)"/>`;
  g += barBlock(I, id);

  // nanobot stream from the emitter to the weld seam
  const src = I.P(0.5, 0.5, 1.53);
  const dst = I.P(2.5, 0, 1.55);
  const r = rng(7);
  let stream = '';
  for (let k = 0; k < 7; k++) {
    const lift = I.s * (0.5 + k * 0.1);
    const jitter = (k - 3) * I.s * 0.06;
    const cx = (src[0] + dst[0]) / 2 + jitter, cy = Math.min(src[1], dst[1]) - lift;
    const col = k % 2 ? '#5fd7ff' : '#ffb347';
    const dot = f(I.s * 0.032), gap = f(I.s * (0.09 + r() * 0.05));
    stream += `<path d="M${f(src[0])},${f(src[1])} Q${f(cx)},${f(cy)} ${f(dst[0] + jitter * 0.4)},${f(dst[1])}" fill="none" stroke="${col}" stroke-width="${dot}" stroke-linecap="round" stroke-dasharray="0 ${gap}" stroke-dashoffset="${f(r() * 40)}" opacity=".9"/>`;
  }
  g += `<g filter="url(#${id}glow)">${stream}</g>`;
  g += `<circle cx="${f(src[0])}" cy="${f(src[1])}" r="${f(I.s * 0.32)}" fill="url(#${id}emit)"/>`;

  // sparks at the weld point
  let sparks = '';
  for (let k = 0; k < 16; k++) {
    const a = r() * Math.PI * 2, len = I.s * (0.08 + r() * 0.22);
    const x1 = dst[0] + Math.cos(a) * I.s * 0.05, y1 = dst[1] + Math.sin(a) * I.s * 0.05;
    sparks += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x1 + Math.cos(a) * len)}" y2="${f(y1 + Math.sin(a) * len)}" stroke="${r() > 0.5 ? '#ffe08a' : '#ff9a2e'}" stroke-width="${f(1.5 + r() * 2)}" stroke-linecap="round"/>`;
  }
  g += `<circle cx="${f(dst[0])}" cy="${f(dst[1])}" r="${f(I.s * 0.42)}" fill="url(#${id}spark)"/>`;
  g += `<g filter="url(#${id}glow)">${sparks}</g>`;
  return g;
}

/* ---------- icons ---------- */
const ICON = {
  cross: c => `<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none" stroke="${c}" stroke-width="4"/><path d="M19 19 L37 37 M37 19 L19 37" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`,
  check: c => `<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none" stroke="${c}" stroke-width="4"/><path d="M17 29 L25 37 L40 20" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  hex: (c, s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 34 34"><path d="M17 2 L30 9.5 L30 24.5 L17 32 L4 24.5 L4 9.5 Z" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="3"/><circle cx="17" cy="17" r="5" fill="${c}"/></svg>`,
  chip: c => `<svg width="56" height="56" viewBox="0 0 56 56"><g stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M21 6 V12 M28 6 V12 M35 6 V12 M21 44 V50 M28 44 V50 M35 44 V50 M6 21 H12 M6 28 H12 M6 35 H12 M44 21 H50 M44 28 H50 M44 35 H50"/></g><rect x="12" y="12" width="32" height="32" rx="6" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="3.5"/><rect x="21" y="21" width="14" height="14" rx="2" fill="${c}"/></svg>`,
  plates: c => `<svg width="56" height="56" viewBox="0 0 56 56">${[30, 20, 10].map(y => `<path d="M6 ${y + 8} L28 ${y} L50 ${y + 8} L50 ${y + 14} L28 ${y + 22} L6 ${y + 14} Z" fill="#111" stroke="${c}" stroke-width="3" stroke-linejoin="round"/><path d="M6 ${y + 8} L28 ${y + 16} L50 ${y + 8}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`).join('')}</svg>`,
  checkSmall: c => `<svg width="40" height="40" viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="9" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="3"/><path d="M11 21 L17.5 27.5 L29 14" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  weld: `<svg width="84" height="84" viewBox="0 0 84 84"><path d="M14 30 L42 16 L70 30 L70 60 L42 74 L14 60 Z" fill="#5fd7ff" fill-opacity=".1" stroke="#5fd7ff" stroke-width="3" stroke-dasharray="7 6"/><path d="M14 46 L42 60 L70 46 L70 60 L42 74 L14 60 Z" fill="#9fa9b8" stroke="#c9d1dc" stroke-width="2.5"/><path d="M14 46 L42 60 L70 46" fill="none" stroke="#ffb347" stroke-width="4" stroke-linecap="round"/><g stroke="#ffd27a" stroke-width="3" stroke-linecap="round"><path d="M42 60 L42 48"/><path d="M42 60 L33 52"/><path d="M42 60 L51 52"/></g></svg>`,
  repair: `<svg width="84" height="84" viewBox="0 0 84 84"><path d="M14 26 L42 12 L70 26 L70 58 L42 72 L14 58 Z" fill="#3473d4" stroke="#9cc9ff" stroke-width="3"/><path d="M14 26 L42 40 L70 26 M42 40 L42 72" fill="none" stroke="#9cc9ff" stroke-width="2.5" opacity=".7"/><rect x="50" y="44" width="28" height="28" rx="8" fill="#0a1b35" stroke="#4fdc8f" stroke-width="3"/><path d="M64 51 L64 65 M57 58 L71 58" stroke="#4fdc8f" stroke-width="4.5" stroke-linecap="round"/></svg>`,
  grind: (() => {
    let teeth = '';
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8, b = a + Math.PI / 16;
      teeth += `${i ? 'L' : 'M'}${f(42 + Math.cos(a) * 33)} ${f(42 + Math.sin(a) * 33)} L${f(42 + Math.cos(b) * 26)} ${f(42 + Math.sin(b) * 26)} `;
    }
    return `<svg width="84" height="84" viewBox="0 0 84 84"><path d="${teeth}Z" fill="#7d8797" stroke="#c9d1dc" stroke-width="2.5" stroke-linejoin="round"/><circle cx="42" cy="42" r="15" fill="#1f2a3a" stroke="#c9d1dc" stroke-width="2.5"/><circle cx="42" cy="42" r="5" fill="#ffb347"/><g stroke="#ffb347" stroke-width="3" stroke-linecap="round"><path d="M74 10 L66 18"/><path d="M80 22 L70 25"/><path d="M62 4 L59 14"/></g></svg>`;
  })(),
  collect: `<svg width="84" height="84" viewBox="0 0 84 84"><path d="M12 50 L12 72 L72 72 L72 50" fill="none" stroke="#c9d1dc" stroke-width="4" stroke-linejoin="round"/><path d="M12 50 L28 50 L32 58 L52 58 L56 50 L72 50" fill="#1f2a3a" stroke="#c9d1dc" stroke-width="3" stroke-linejoin="round"/><path d="M42 8 L42 40 M30 29 L42 41 L54 29" fill="none" stroke="#5fd7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="14" width="12" height="12" rx="2" fill="#ffb347" transform="rotate(18 21 20)"/><rect x="58" y="18" width="11" height="11" rx="2" fill="#9fa9b8" transform="rotate(-14 63 23)"/></svg>`,
};

/* ---------- pages ---------- */
const KICKER = 'Build &amp; Repair &middot; Nanobot System';

function thumbPage() {
  const I = iso(140, 215, 390);
  return `<div class="canvas thumb">
    <svg class="layer" width="1024" height="1024" viewBox="0 0 1024 1024">${stars(1024, 1024, 170, 3)}${scene(I, 't')}</svg>
    <div class="fade"></div>
    <div class="hazard top"></div>
    <div class="text">
      <div class="kicker">Nanobot System</div>
      <div class="title">Build &amp; Repair</div>
      <div class="badge">Updated for SE 1.210</div>
    </div>
  </div>`;
}

function wide(content) {
  const I = iso(100, 175, 350);
  return `<div class="canvas wide">
    <svg class="layer" width="1920" height="1080" viewBox="0 0 1920 1080">${stars(1920, 1080, 260, 11)}</svg>
    <svg class="art" width="760" height="760" viewBox="0 0 760 760">${scene(I, 'w')}</svg>
    <div class="hazard top"></div>
    <div class="content"><div class="kicker">${KICKER}</div>${content}</div>
    <div class="hazard bottom"></div>
  </div>`;
}

function updatedPage() {
  return wide(`<div class="title">Updated for<br>SE 1.210</div>
    <div class="compare">
      <div class="card info"><div class="head">${ICON.chip('#5fd7ff')}<div class="tag">Latest code</div></div>
        <p>Built on the newest maintained code, with dozens of bug fixes.</p></div>
      <div class="card cost"><div class="head">${ICON.plates('#f5c400')}<div class="tag">Nerfed cost</div></div>
        <p>About 10x the original parts, plus Superconductors. A real investment.</p></div>
    </div>
    <ul class="points">
      <li>${ICON.hex('#5fd7ff')}<span>Every component hand-off is checked, so <b>nothing gets lost</b></span></li>
      <li>${ICON.hex('#5fd7ff')}<span>Works with the Build and Repair companion script</span></li>
      <li>${ICON.hex('#5fd7ff')}<span>Check the running build with <b>/nanobars version</b></span></li>
    </ul>`);
}

function featuresPage() {
  const tile = (icon, h, p) => `<div class="tile">${icon}<div><h3>${h}</h3><p>${p}</p></div></div>`;
  return wide(`<div class="title">Your base,<br>built for you</div>
    <div class="tiles">
      ${tile(ICON.weld, 'Weld', 'Builds projections and finishes half-built blocks')}
      ${tile(ICON.repair, 'Repair', 'Fixes damaged blocks automatically')}
      ${tile(ICON.grind, 'Grind', 'Takes apart enemy, neutral or color-marked blocks')}
      ${tile(ICON.collect, 'Collect', 'Picks up floating items and sends them to your cargo')}
    </div>
    <div class="chips">
      <span class="chip">Pulls parts from cargo &amp; assemblers</span>
      <span class="chip">Priority lists &amp; work modes</span>
      <span class="chip">Safe zone &amp; shield aware</span>
      <span class="chip">Programmable Block support</span>
      <span class="chip">Admin /nanobars commands</span>
    </div>`);
}

function dropinPage() {
  const row = t => `<li>${ICON.checkSmall('#4fdc8f')}<span>${t}</span></li>`;
  return wide(`<div class="title">Drop-in<br>replacement</div>
    <ul class="points">
      ${row('<b>Same block IDs</b> as the original Nanobot mod, so your existing Build and Repair blocks stay in your world')}
      ${row('<b>Per-block settings carry over</b> from the old mod')}
      ${row('Large and small grid blocks')}
      ${row('Works in single player, hosted games and dedicated servers')}
    </ul>
    <div class="warn"><div class="txt"><b>Remove the old mod first</b><span>Never run two Build and Repair mods in the same world.</span></div></div>`);
}

const page = new URLSearchParams(location.search).get('page') || 'thumb';
document.getElementById('root').innerHTML = { thumb: thumbPage, updated: updatedPage, features: featuresPage, dropin: dropinPage }[page]();
</script>
</body>
</html>
